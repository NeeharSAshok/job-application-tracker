server.port=8080

# ===== Default profile: H2 in-memory (zero setup, great for demo/interview) =====
spring.datasource.url=jdbc:h2:mem:jobtrackerdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===== JWT =====
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B59}
jwt.expiration.ms=86400000

# ===== CORS =====
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}

logging.level.org.springframework.security=INFO
