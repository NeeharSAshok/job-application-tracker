server.port=8080

# Activate with: --spring.profiles.active=mysql
spring.datasource.url=jdbc:mysql://localhost:3306/jobtrackerdb?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B59}
jwt.expiration.ms=86400000

app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}
